{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4 no-print">
    <h2>Purchases Report</h2>
    <div>
        <button onclick="window.print()" class="btn btn-info text-white"><i class="fas fa-print"></i> Print</button>
        <a href="{{ url_for('reports_dashboard') }}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
    </div>
</div>

<div class="card shadow mb-4">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-bordered table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>Date</th>
                        <th>Number of Purchases</th>
                        <th>Total Purchase Cost</th>
                    </tr>
                </thead>
                <tbody>
                    {% for row in report_data %}
                    <tr>
                        <td>{{ row._id }}</td>
                        <td>{{ row.count }}</td>
                        <td>₹{{ "%.2f"|format(row.total_purchases) }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
