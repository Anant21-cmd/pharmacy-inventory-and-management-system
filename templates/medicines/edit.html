{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Edit Medicine: {{ medicine.medicine_name }}</h2>
    <a href="{{ url_for('list_medicines') }}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
</div>

<div class="card shadow">
    <div class="card-body">
        <form method="POST">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label>Medicine Name *</label>
                    <input type="text" name="medicine_name" class="form-control" value="{{ medicine.medicine_name }}" required>
                </div>
                <div class="col-md-6">
                    <label>Generic Name</label>
                    <input type="text" name="generic_name" class="form-control" value="{{ medicine.generic_name }}">
                </div>
            </div>
            
            <div class="row mb-3">
                <div class="col-md-4">
                    <label>Brand Name</label>
                    <input type="text" name="brand_name" class="form-control" value="{{ medicine.brand_name }}">
                </div>
                <div class="col-md-4">
                    <label>Category *</label>
                    <select name="category" class="form-select" required>
                        {% for cat in categories %}
                        <option value="{{ cat.name }}" {% if cat.name == medicine.category %}selected{% endif %}>{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label>Dosage</label>
                    <input type="text" name="dosage" class="form-control" value="{{ medicine.dosage }}">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-3">
                    <label>Form</label>
                    <input type="text" name="form" class="form-control" value="{{ medicine.form }}">
                </div>
                <div class="col-md-3">
                    <label>Strength</label>
                    <input type="text" name="strength" class="form-control" value="{{ medicine.strength }}">
                </div>
                <div class="col-md-3">
                    <label>Manufacturer</label>
                    <input type="text" name="manufacturer" class="form-control" value="{{ medicine.manufacturer }}">
                </div>
                <div class="col-md-3">
                    <label>Supplier *</label>
                    <select name="supplier_id" class="form-select" required>
                        {% for sup in suppliers %}
                        <option value="{{ sup._id }}" {% if sup._id == medicine.supplier_id %}selected{% endif %}>{{ sup.supplier_name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-3">
                    <label>Batch Number *</label>
                    <input type="text" name="batch_number" class="form-control" value="{{ medicine.batch_number }}" required>
                </div>
                <div class="col-md-3">
                    <label>Purchase Price *</label>
                    <input type="number" step="0.01" min="0" name="purchase_price" class="form-control" value="{{ medicine.purchase_price }}" required>
                </div>
                <div class="col-md-3">
                    <label>Selling Price *</label>
                    <input type="number" step="0.01" min="0" name="selling_price" class="form-control" value="{{ medicine.selling_price }}" required>
                </div>
                <div class="col-md-3">
                    <label>Quantity *</label>
                    <input type="number" min="0" name="quantity" class="form-control" value="{{ medicine.quantity }}" required>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-3">
                    <label>Minimum Stock *</label>
                    <input type="number" min="0" name="minimum_stock" class="form-control" value="{{ medicine.minimum_stock }}" required>
                </div>
                <div class="col-md-3">
                    <label>Manufacturing Date *</label>
                    <input type="date" name="manufacturing_date" class="form-control" value="{{ medicine.manufacturing_date.strftime('%Y-%m-%d') }}" required>
                </div>
                <div class="col-md-3">
                    <label>Expiry Date *</label>
                    <input type="date" name="expiry_date" class="form-control" value="{{ medicine.expiry_date.strftime('%Y-%m-%d') }}" required>
                </div>
                <div class="col-md-3 d-flex align-items-end pb-2">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="prescription_required" id="prescription_required" value="1" {% if medicine.prescription_required %}checked{% endif %}>
                        <label class="form-check-label" for="prescription_required">
                            Prescription Required
                        </label>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label>Description</label>
                <textarea name="description" class="form-control" rows="3">{{ medicine.description }}</textarea>
            </div>

            <button type="submit" class="btn btn-primary">Update Medicine</button>
        </form>
    </div>
</div>
{% endblock %}
