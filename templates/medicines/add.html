{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Add Medicine</h2>
    <a href="{{ url_for('list_medicines') }}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
</div>

<div class="card shadow">
    <div class="card-body">
        <form method="POST">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label>Medicine Name *</label>
                    <input type="text" name="medicine_name" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label>Generic Name</label>
                    <input type="text" name="generic_name" class="form-control">
                </div>
            </div>
            
            <div class="row mb-3">
                <div class="col-md-4">
                    <label>Brand Name</label>
                    <input type="text" name="brand_name" class="form-control">
                </div>
                <div class="col-md-4">
                    <label>Category *</label>
                    <select name="category" class="form-select" required>
                        <option value="">Select Category</option>
                        {% for cat in categories %}
                        <option value="{{ cat.name }}">{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label>Dosage</label>
                    <input type="text" name="dosage" class="form-control">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-3">
                    <label>Form</label>
                    <input type="text" name="form" class="form-control">
                </div>
                <div class="col-md-3">
                    <label>Strength</label>
                    <input type="text" name="strength" class="form-control">
                </div>
                <div class="col-md-3">
                    <label>Manufacturer</label>
                    <input type="text" name="manufacturer" class="form-control">
                </div>
                <div class="col-md-3">
                    <label>Supplier *</label>
                    <select name="supplier_id" class="form-select" required>
                        <option value="">Select Supplier</option>
                        {% for sup in suppliers %}
                        <option value="{{ sup._id }}">{{ sup.supplier_name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-3">
                    <label>Batch Number *</label>
                    <input type="text" name="batch_number" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label>Purchase Price *</label>
                    <input type="number" step="0.01" min="0" name="purchase_price" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label>Selling Price *</label>
                    <input type="number" step="0.01" min="0" name="selling_price" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label>Quantity *</label>
                    <input type="number" min="0" name="quantity" class="form-control" required>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-3">
                    <label>Minimum Stock *</label>
                    <input type="number" min="0" name="minimum_stock" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label>Manufacturing Date *</label>
                    <input type="date" name="manufacturing_date" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label>Expiry Date *</label>
                    <input type="date" name="expiry_date" class="form-control" required>
                </div>
                <div class="col-md-3 d-flex align-items-end pb-2">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="prescription_required" id="prescription_required" value="1">
                        <label class="form-check-label" for="prescription_required">
                            Prescription Required
                        </label>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label>Description</label>
                <textarea name="description" class="form-control" rows="3"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Save Medicine</button>
        </form>
    </div>
</div>
{% endblock %}
