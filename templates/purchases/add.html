{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>New Purchase (Strict Mode)</h2>
    <a href="{{ url_for('list_purchases') }}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
</div>

<div class="row">
    <div class="col-lg-12">
        <div class="card shadow mb-4">
            <div class="card-header py-3 bg-primary text-white">
                <h6 class="m-0 font-weight-bold"><i class="fas fa-truck-loading"></i> Purchase Details</h6>
            </div>
            <div class="card-body">
                
                <form method="POST" action="{{ url_for('add_purchase') }}">
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="fw-bold">Supplier *</label>
                            <select name="supplier_id" class="form-select" required>
                                <option value="">Select Supplier</option>
                                {% for sup in suppliers %}
                                <option value="{{ sup._id }}">{{ sup.supplier_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="fw-bold">Invoice Number *</label>
                            <input type="text" name="invoice_number" class="form-control" required>
                        </div>
                        <div class="col-md-3">
                            <label class="fw-bold">Payment Method *</label>
                            <select name="payment_method" class="form-select" required>
                                <option value="Bank Transfer">Bank Transfer</option>
                                <option value="Cash">Cash</option>
                                <option value="Cheque">Cheque</option>
                            </select>
                        </div>
                    </div>

                    <hr>
                    <h5 class="mb-3 text-success">Purchased Medicines</h5>
                    <p class="text-muted small">Fill out up to 5 items. Leave unused rows blank.</p>

                    <div id="items-container">
                        {% for i in range(5) %}
                        <div class="row mb-3 p-2 border rounded bg-light item-row">
                            <div class="col-md-6">
                                <label class="small text-muted">Medicine Selection</label>
                                <select name="medicine_id[]" class="form-select">
                                    <option value="">-- Select Medicine --</option>
                                    {% for med in medicines %}
                                    <option value="{{ med._id }}">
                                        {{ med.medicine_name }} ({{ med.generic_name }})
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="small text-muted">Quantity</label>
                                <input type="number" name="quantity[]" class="form-control" min="1" placeholder="Enter quantity">
                            </div>
                            <div class="col-md-3">
                                <label class="small text-muted">Purchase Price (Total)</label>
                                <input type="number" name="purchase_price[]" class="form-control" min="0" step="0.01" placeholder="Enter total price">
                            </div>
                        </div>
                        {% endfor %}
                    </div>

                    <div class="mt-4 text-end">
                        <button type="submit" class="btn btn-success btn-lg px-5"><i class="fas fa-check-circle"></i> Save Purchase & Update Stock</button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
