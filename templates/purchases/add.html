{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>New Purchase</h2>
    <a href="{{ url_for('list_purchases') }}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
</div>

<div class="card shadow mb-4">
    <div class="card-body">
        <form method="POST">
            <div class="row mb-4 border-bottom pb-3">
                <div class="col-md-4">
                    <label>Supplier *</label>
                    <select name="supplier_id" class="form-select" required>
                        <option value="">Select Supplier</option>
                        {% for sup in suppliers %}
                        <option value="{{ sup._id }}">{{ sup.supplier_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label>Invoice Number *</label>
                    <input type="text" name="invoice_number" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label>Payment Method *</label>
                    <select name="payment_method" class="form-select" required>
                        <option value="Cash">Cash</option>
                        <option value="Card">Card</option>
                        <option value="UPI">UPI</option>
                        <option value="Bank Transfer">Bank Transfer</option>
                    </select>
                </div>
            </div>

            <h5 class="mb-3">Purchase Items</h5>
            <div id="items-container">
                <div class="row mb-2 item-row">
                    <div class="col-md-5">
                        <select name="medicine_id[]" class="form-select" required>
                            <option value="">Select Medicine</option>
                            {% for med in medicines %}
                            <option value="{{ med._id }}">{{ med.medicine_name }} (Batch: {{ med.batch_number }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3">
                        <input type="number" name="quantity[]" class="form-control" placeholder="Quantity" min="1" required>
                    </div>
                    <div class="col-md-3">
                        <input type="number" step="0.01" name="purchase_price[]" class="form-control" placeholder="Price per unit" required>
                    </div>
                    <div class="col-md-1">
                        <button type="button" class="btn btn-danger remove-item"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            </div>

            <button type="button" class="btn btn-success btn-sm mb-4" id="add-item">
                <i class="fas fa-plus"></i> Add Item
            </button>

            <div>
                <button type="submit" class="btn btn-primary">Complete Purchase</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('add-item').addEventListener('click', function() {
    const container = document.getElementById('items-container');
    const firstRow = container.querySelector('.item-row');
    const newRow = firstRow.cloneNode(true);
    // Clear inputs
    newRow.querySelectorAll('input').forEach(input => input.value = '');
    newRow.querySelector('select').selectedIndex = 0;
    
    // Add remove event
    newRow.querySelector('.remove-item').addEventListener('click', function() {
        if(container.querySelectorAll('.item-row').length > 1) {
            newRow.remove();
        }
    });
    
    container.appendChild(newRow);
});

// For the first row remove button
document.querySelector('.remove-item').addEventListener('click', function() {
    const container = document.getElementById('items-container');
    if(container.querySelectorAll('.item-row').length > 1) {
        this.closest('.item-row').remove();
    }
});
</script>
{% endblock %}
