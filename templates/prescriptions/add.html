{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Add Prescription (Strict Mode)</h2>
    <a href="{{ url_for('list_prescriptions') }}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
</div>

<div class="row">
    <div class="col-lg-12">
        <div class="card shadow mb-4">
            <div class="card-header py-3 bg-primary text-white">
                <h6 class="m-0 font-weight-bold"><i class="fas fa-file-prescription"></i> Prescription Details</h6>
            </div>
            <div class="card-body">
                
                <form method="POST" action="{{ url_for('add_prescription') }}">
                    
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="fw-bold">Customer / Patient *</label>
                            <select name="customer_id" class="form-select" required>
                                <option value="">Select Patient</option>
                                {% for cust in customers %}
                                <option value="{{ cust._id }}">{{ cust.customer_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="fw-bold">Doctor Name *</label>
                            <input type="text" name="doctor_name" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="fw-bold">Date *</label>
                            <input type="date" name="prescription_date" class="form-control" required>
                        </div>
                    </div>

                    <hr>
                    <h5 class="mb-3 text-success">Prescribed Medicines</h5>
                    <p class="text-muted small">Fill out up to 5 items. Leave unused rows blank.</p>

                    <div id="items-container">
                        {% for i in range(5) %}
                        <div class="row mb-3 p-2 border rounded bg-light item-row">
                            <div class="col-md-3">
                                <label class="small text-muted">Medicine</label>
                                <select name="medicine_id[]" class="form-select">
                                    <option value="">-- Select Medicine --</option>
                                    {% for med in medicines %}
                                    <option value="{{ med._id }}">{{ med.medicine_name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="small text-muted">Dosage</label>
                                <input type="text" name="dosage[]" class="form-control" placeholder="e.g. 500mg">
                            </div>
                            <div class="col-md-3">
                                <label class="small text-muted">Frequency</label>
                                <input type="text" name="frequency[]" class="form-control" placeholder="e.g. Twice a day">
                            </div>
                            <div class="col-md-3">
                                <label class="small text-muted">Duration</label>
                                <input type="text" name="duration[]" class="form-control" placeholder="e.g. 5 days">
                            </div>
                        </div>
                        {% endfor %}
                    </div>
                    
                    <div class="mb-3">
                        <label class="fw-bold">Special Instructions</label>
                        <textarea name="instructions" class="form-control" rows="3" placeholder="Take after meals..."></textarea>
                    </div>

                    <div class="mt-4 text-end">
                        <button type="submit" class="btn btn-success btn-lg px-5"><i class="fas fa-save"></i> Save Prescription</button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
