{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Add Prescription</h2>
    <a href="{{ url_for('list_prescriptions') }}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
</div>

<div class="card shadow">
    <div class="card-body">
        <form method="POST">
            <div class="row mb-3">
                <div class="col-md-4">
                    <label>Customer *</label>
                    <select name="customer_id" class="form-select" required>
                        <option value="">Select Customer</option>
                        {% for cust in customers %}
                        <option value="{{ cust._id }}">{{ cust.customer_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label>Doctor Name *</label>
                    <input type="text" name="doctor_name" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label>Prescription Date *</label>
                    <input type="date" name="prescription_date" class="form-control" required>
                </div>
            </div>

            <h5 class="mb-3 mt-4">Medicines Prescribed</h5>
            <div id="items-container">
                <div class="row mb-2 item-row">
                    <div class="col-md-3">
                        <select name="medicine_id[]" class="form-select" required>
                            <option value="">Select Medicine</option>
                            {% for med in medicines %}
                            <option value="{{ med._id }}">{{ med.medicine_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3">
                        <input type="text" name="dosage[]" class="form-control" placeholder="Dosage (e.g., 1 tablet)" required>
                    </div>
                    <div class="col-md-3">
                        <input type="text" name="frequency[]" class="form-control" placeholder="Frequency (e.g., Twice daily)" required>
                    </div>
                    <div class="col-md-2">
                        <input type="text" name="duration[]" class="form-control" placeholder="Duration (e.g., 5 days)" required>
                    </div>
                    <div class="col-md-1">
                        <button type="button" class="btn btn-danger remove-item"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            </div>

            <button type="button" class="btn btn-success btn-sm mb-4" id="add-item">
                <i class="fas fa-plus"></i> Add Medicine
            </button>

            <div class="mb-4">
                <label>Instructions / Notes</label>
                <textarea name="instructions" class="form-control" rows="3"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Save Prescription</button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('add-item').addEventListener('click', function() {
    const container = document.getElementById('items-container');
    const firstRow = container.querySelector('.item-row');
    const newRow = firstRow.cloneNode(true);
    
    newRow.querySelectorAll('input').forEach(input => input.value = '');
    newRow.querySelector('select').selectedIndex = 0;
    
    newRow.querySelector('.remove-item').addEventListener('click', function() {
        if(container.querySelectorAll('.item-row').length > 1) {
            newRow.remove();
        }
    });
    
    container.appendChild(newRow);
});

document.querySelector('.remove-item').addEventListener('click', function() {
    const container = document.getElementById('items-container');
    if(container.querySelectorAll('.item-row').length > 1) {
        this.closest('.item-row').remove();
    }
});
</script>
{% endblock %}
