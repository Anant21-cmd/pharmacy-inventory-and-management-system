{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>New Sale (Strict Mode)</h2>
    <a href="{{ url_for('list_sales') }}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
</div>

<div class="row">
    <div class="col-lg-12">
        <div class="card shadow mb-4">
            <div class="card-header py-3 bg-primary text-white">
                <h6 class="m-0 font-weight-bold"><i class="fas fa-shopping-cart"></i> Sale Details</h6>
            </div>
            <div class="card-body">
                
                <form method="POST" action="{{ url_for('new_sale') }}" enctype="multipart/form-data">
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="fw-bold">Customer *</label>
                            <select name="customer_id" class="form-select" required>
                                <option value="">Select Customer</option>
                                {% for cust in customers %}
                                <option value="{{ cust._id }}">{{ cust.customer_name }} ({{ cust.phone }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="fw-bold text-primary"><i class="fas fa-camera"></i> Upload Prescription Image</label>
                            <input type="file" name="image" class="form-control" accept="image/*">
                            <small class="text-muted">Image will be securely saved to MongoDB GridFS</small>
                        </div>
                    </div>

                    <hr>
                    <h5 class="mb-3 text-success">Cart Items</h5>
                    <p class="text-muted small">Fill out up to 5 items. Leave unused rows blank.</p>

                    <div id="items-container">
                        {% for i in range(5) %}
                        <div class="row mb-3 p-2 border rounded bg-light item-row">
                            <div class="col-md-8">
                                <label class="small text-muted">Medicine Selection</label>
                                <select name="medicine_id[]" class="form-select">
                                    <option value="">-- Select Medicine --</option>
                                    {% for med in medicines %}
                                    <option value="{{ med._id }}">
                                        {{ med.medicine_name }} - ₹{{ "%.2f"|format(med.selling_price) }} (Stock: {{ med.quantity }})
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="small text-muted">Quantity</label>
                                <input type="number" name="quantity[]" class="form-control" min="1" placeholder="Enter quantity">
                            </div>
                        </div>
                        {% endfor %}
                    </div>

                    <hr>
                    
                    <div class="row mb-3 mt-4">
                        <div class="col-md-6">
                            <label class="fw-bold">Payment Method *</label>
                            <select name="payment_method" class="form-select" required>
                                <option value="Cash">Cash</option>
                                <option value="Card">Card</option>
                                <option value="UPI">UPI</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="fw-bold">Flat Discount (₹)</label>
                            <input type="number" name="discount" class="form-control" min="0" step="0.01" value="0">
                        </div>
                    </div>

                    <div class="mt-4 text-end">
                        <button type="submit" class="btn btn-success btn-lg px-5"><i class="fas fa-check-circle"></i> Complete Sale</button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
