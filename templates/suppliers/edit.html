{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Edit Supplier</h2>
    <a href="{{ url_for('list_suppliers') }}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
</div>

<div class="card shadow">
    <div class="card-body">
        <form method="POST">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label>Supplier Name *</label>
                    <input type="text" name="supplier_name" class="form-control" value="{{ supplier.supplier_name }}" required>
                </div>
                <div class="col-md-6">
                    <label>Company Name *</label>
                    <input type="text" name="company_name" class="form-control" value="{{ supplier.company_name }}" required>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label>Phone *</label>
                    <input type="text" name="phone" class="form-control" value="{{ supplier.phone }}" required>
                </div>
                <div class="col-md-6">
                    <label>Email *</label>
                    <input type="email" name="email" class="form-control" value="{{ supplier.email }}" required>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label>GST Number *</label>
                    <input type="text" name="gst_number" class="form-control" value="{{ supplier.gst_number }}" required>
                </div>
                <div class="col-md-6">
                    <label>Address *</label>
                    <textarea name="address" class="form-control" rows="2" required>{{ supplier.address }}</textarea>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Update Supplier</button>
        </form>
    </div>
</div>
{% endblock %}
